<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Almari</title>
    <meta name="description" content="Ghar ke saare kaagaz, ek jagah. Your family's documents, ID numbers, passwords and bank details, in one place." />

    <!-- Installable web app (the iPhone version): Add to Home Screen from Safari. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Almari" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f4efe6;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #12110e;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Fields draw their own rounded focus ring; the browser's square one would not follow the corners. */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* The boot screen, until the app has loaded: dark, quiet, brass. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 80% at 50% 38%, #1d1b16 0%, #12110e 62%);
        transition: opacity 360ms ease, visibility 360ms ease;
      }
      #boot.gone {
        opacity: 0;
        visibility: hidden;
      }
      #boot .plate {
        padding: 12px 30px;
        border-radius: 14px;
        border: 1.5px solid #b8955c;
        background: linear-gradient(180deg, #8a6a3c 0%, #6e5330 100%);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 246, 230, 0.25);
        color: #fff6e6;
        font: 700 34px/1.1 'Eczar', Georgia, 'Times New Roman', serif;
        letter-spacing: 0.5px;
      }
      #boot .line {
        color: #a39b8b;
        font: 400 14px/1.4 -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.3px;
      }
      #boot .bar {
        width: 72px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: #2a2620;
        margin-top: 10px;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #d2b27a;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after { animation: none; width: 100%; }
      }
    </style>

    <script>
      // Offline support for the installed web app. Skipped on the development
      // server (port 8081) so stale development code is never cached.
      if ('serviceWorker' in navigator && location.port !== '8081') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.warn('Offline support is unavailable', error);
          });
        });
      }

      // Updates for the installed app. A phone keeps it open in the background
      // for days, so reopening it only resumes the old release. When it comes
      // back after a minute or more (the vault locks then anyway), it looks for
      // a newer release and reloads into it, unless a box on screen has text in
      // it that could be lost; then it tries again the next time.
      (function () {
        if (location.port === '8081') return;
        var ENTRY = /\/_expo\/static\/js\/web\/entry-[^"']+\.js/;
        var AWAY_MS = 60 * 1000;
        var hiddenAt = 0;

        function current() {
          var script = document.querySelector('script[src*="/_expo/static/js/web/entry-"]');
          var match = script && script.getAttribute('src').match(ENTRY);
          return match && match[0];
        }

        function typing() {
          var boxes = document.querySelectorAll('input, textarea');
          for (var i = 0; i < boxes.length; i++) if (boxes[i].value) return true;
          return false;
        }

        function check() {
          var now = current();
          if (!now) return;
          fetch('/', { cache: 'no-store' })
            .then(function (response) { return response.ok ? response.text() : ''; })
            .then(function (html) {
              var match = html.match(ENTRY);
              var latest = match && match[0];
              if (!latest || latest === now || typing()) return;
              // Never loop on one release if the page somehow comes back old.
              try {
                if (sessionStorage.getItem('almari-reloaded-for') === latest) return;
                sessionStorage.setItem('almari-reloaded-for', latest);
              } catch (e) {}
              location.reload();
            })
            .catch(function () {});
        }

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') hiddenAt = Date.now();
          else if (hiddenAt && Date.now() - hiddenAt >= AWAY_MS) check();
        });
      })();
    </script>
  </head>

  <body>
    <noscript>Almari needs JavaScript to run.</noscript>
    <div id="boot" aria-hidden="true">
      <div class="plate">Almari</div>
      <div class="line">Ghar ke saare kaagaz, ek jagah.</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
